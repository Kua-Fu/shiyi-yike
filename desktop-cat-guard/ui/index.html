<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>猫猫守卫</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="cat.css"></head>
<body>
  <div class="titlebar"><span class="titlebar-name">CAT GUARD</span><span class="local-status"><i></i> 本地陪伴，安心专注</span></div>
  <main>
    <header><div class="brand"><span class="brand-icon">♧</span><div><h1>猫猫守卫</h1><p>好好工作，也要好好休息。</p></div></div><button id="preview" class="button quiet"><span>▷</span> 预览猫猫</button></header>
    <section class="hero" aria-label="专注计时器">
      <div class="timer-panel"><div class="eyebrow"><span class="status-dot"></span><span id="phase-label">准备好，就慢慢开始</span></div>
        <div id="countdown" class="countdown" role="timer" aria-label="剩余时间">25<span>:</span>00</div>
        <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
        <p id="timer-note" class="timer-note">下一次休息，让猫猫来提醒你。</p>
        <div class="timer-actions"><button id="primary" class="button primary"><span id="primary-icon">▶</span><span id="primary-label">开始专注</span></button><button id="reset" class="button reset" title="停止并重置计时" aria-label="停止并重置计时">↺</button></div>
        <div class="session-info"><span><b id="rounds">0</b> 轮专注</span><i></i><span><b id="focus-minutes">0</b> 分钟陪伴</span><span class="session-tag">本次</span></div>
      </div>
      <div class="cat-panel"><div class="cat-halo"></div><span class="spark spark-one">✧</span><span class="spark spark-two">✦</span><span class="tiny-label">YOUR LITTLE BREAK BUDDY</span>
        <button id="pet-cat" class="cat-button" aria-label="摸摸猫猫"><span class="cat-stage awake" data-cat data-color="cream"></span></button>
        <div id="cat-message" class="cat-message">你负责努力，我负责提醒休息。</div><div class="cat-name"><span class="small-paw">✿</span><span id="cat-name">奶油</span><span>·</span><span>今日值班猫</span></div>
      </div>
    </section>
    <section class="settings" aria-label="陪伴设置"><div class="section-top"><h2>按你的节奏来</h2><span id="save-status" role="status">设置自动保存</span></div>
      <div class="settings-grid">
        <div class="setting-card"><label for="work-minutes">专注时长 <span class="card-symbol">◷</span></label><div class="number-field"><input id="work-minutes" type="number" min="1" max="180" value="25"><span>分钟</span></div><div class="presets" aria-label="专注时长预设"><button data-work="25" class="selected">25</button><button data-work="45">45</button><button data-work="60">60</button></div></div>
        <div class="setting-card"><label for="break-minutes">休息时长 <span class="card-symbol">☕</span></label><div class="number-field"><input id="break-minutes" type="number" min="1" max="60" value="5"><span>分钟</span></div><p class="card-hint">看看远处，伸个懒腰。</p></div>
        <div class="setting-card cat-picker"><label>选择你的搭子 <span class="card-symbol">♡</span></label><div class="swatches" role="group" aria-label="选择猫咪"><button class="swatch cream selected" data-choice="cream" aria-label="奶油猫" aria-pressed="true"><span>🐱</span></button><button class="swatch gray" data-choice="gray" aria-label="乌云猫" aria-pressed="false"><span>🐱</span></button><button class="swatch peach" data-choice="peach" aria-label="蜜桃猫" aria-pressed="false"><span>🐱</span></button></div><p class="card-hint">每一只，都很会陪伴。</p></div>
      </div>
      <div class="preferences"><label class="toggle-row"><input id="auto-start" type="checkbox"><span class="switch"></span><span>休息后自动开始下一轮</span></label><label class="toggle-row"><input id="all-displays" type="checkbox" checked><span class="switch"></span><span>在所有屏幕上提醒</span></label></div>
    </section>
    <footer><span><span class="footer-dot"></span> 关掉窗口，猫猫也会在菜单栏等你。</span><button id="quit">退出应用 ↗</button></footer>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="cat.js"></script><script src="app.js"></script>
</body></html>
