name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/shiyi-regression-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            # 未登录的公开 Actions 页面会隐藏日志，将安全的末尾堆栈同步到任务注解便于定位。
            error_tail=$(tail -n 30 /tmp/shiyi-regression-tests.log)
            error_tail=${error_tail//'%'/'%25'}
            error_tail=${error_tail//$'\r'/'%0D'}
            error_tail=${error_tail//$'\n'/'%0A'}
            echo "::error title=Regression tests failed::$error_tail"
            exit "$test_status"
          fi
      - name: Build public site
        run: npm run build:web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify published pages
        run: node scripts/verify-deployed-site.mjs "${{ needs.deploy.outputs.page_url }}"
