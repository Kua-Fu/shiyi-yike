<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <pattern id="grain" width="29" height="27" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="0.8" fill="#706855" opacity=".11"/>
      <circle cx="22" cy="19" r="0.65" fill="#706855" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312d26" flood-opacity=".22"/>
    </filter>
    <radialGradient id="wash">
      <stop offset="0" stop-color="#617265" stop-opacity=".22"/>
      <stop offset=".68" stop-color="#617265" stop-opacity=".07"/>
      <stop offset="1" stop-color="#617265" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="560" fill="#d5d0c4"/>
  <rect x="48" y="42" width="1304" height="476" rx="5" fill="#f4f0e5" stroke="#80745d" stroke-opacity=".38" filter="url(#shadow)"/>
  <rect x="48" y="42" width="1304" height="476" rx="5" fill="url(#grain)"/>
  <circle cx="1045" cy="268" r="198" fill="none" stroke="#617265" stroke-opacity=".11" stroke-width="2"/>
  <ellipse cx="1120" cy="260" rx="225" ry="160" fill="url(#wash)" transform="rotate(-8 1120 260)"/>
  <text x="1115" y="330" text-anchor="middle" fill="#202522" opacity=".075" font-family="'Kaiti SC','STKaiti','KaiTi',serif" font-size="210">山</text>
  <rect x="138" y="125" width="72" height="72" rx="7" fill="#9f3f32" stroke="#7f3027" stroke-width="3" transform="rotate(-2 174 161)"/>
  <rect x="146" y="133" width="56" height="56" rx="4" fill="none" stroke="#fff8ee" stroke-opacity=".3" stroke-width="2"/>
  <text x="174" y="177" text-anchor="middle" fill="#fff8ee" font-family="'Kaiti SC','STKaiti','KaiTi',serif" font-size="43" font-weight="700">诗</text>
  <text x="246" y="180" fill="#202522" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-size="58" font-weight="600" letter-spacing="10">诗意一刻</text>
  <text x="248" y="224" fill="#5f665f" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" letter-spacing="4">先秦至清 · 938 篇已校精选</text>
  <line x1="140" y1="278" x2="602" y2="278" stroke="#c9c1af"/>
  <text x="140" y="338" fill="#202522" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-size="29" letter-spacing="4">轻点工具栏图标</text>
  <text x="140" y="388" fill="#202522" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-size="29" letter-spacing="4">即与古人不期而遇</text>
  <rect x="140" y="430" width="176" height="44" rx="22" fill="#202522"/>
  <text x="228" y="458" text-anchor="middle" fill="#fffdf7" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" letter-spacing="3">已校精选</text>
  <rect x="330" y="430" width="176" height="44" rx="22" fill="#fffdf7" stroke="#9f3f32" stroke-width="2"/>
  <text x="418" y="458" text-anchor="middle" fill="#9f3f32" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" letter-spacing="3">全库广览</text>
  <line x1="744" y1="118" x2="744" y2="442" stroke="#c9c1af"/>
  <text x="805" y="176" fill="#9f3f32" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" letter-spacing="5">此刻遇见</text>
  <text x="800" y="250" fill="#202522" font-family="'Kaiti SC','STKaiti','KaiTi',serif" font-size="64" letter-spacing="7">山居秋暝</text>
  <text x="805" y="298" fill="#5f665f" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-size="19" letter-spacing="4">唐 · 王维</text>
  <text x="805" y="354" fill="#202522" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-size="22" letter-spacing="4">明月松间照，清泉石上流。</text>
  <text x="805" y="402" fill="#202522" font-family="'Songti SC','STSong','Noto Serif CJK SC',serif" font-size="22" letter-spacing="4">竹喧归浣女，莲动下渔舟。</text>
